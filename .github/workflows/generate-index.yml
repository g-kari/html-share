name: Generate page index and social metadata

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "wrangler.jsonc"
      - ".github/workflows/generate-index.yml"
  pull_request:
    paths:
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "wrangler.jsonc"
      - ".github/workflows/generate-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test metadata and generation
        run: node --test tests/*.test.mjs

  generate:
    needs: test
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: html-share-generated-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate and commit current pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Regenerate from current main on every retry; never overwrite a newer
          # authored page with output generated from a stale checkout.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node --test tests/*.test.mjs
            node scripts/generate-index.mjs
            if git diff --quiet -- public; then
              echo "Generated pages are already up to date."
              exit 0
            fi
            git add public
            git commit -m "chore: regenerate page index and social metadata"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "main kept changing; rerun generation after the latest edit."
          exit 1
