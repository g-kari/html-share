name: Generate page index

on:
  push:
    branches:
      - main
    paths:
      - "public/**/*.html"
      - "scripts/generate-index.mjs"
      - ".github/workflows/generate-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate index
        run: node scripts/generate-index.mjs

      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- public/index.html; then
            echo "public/index.html is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "chore: regenerate page index"
          git push
