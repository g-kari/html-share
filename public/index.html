<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ChatGPTで生成したHTMLを共有するためのページ一覧です。">
  <title>HTML Share</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2b313d;
      --text: #f2f4f8;
      --sub: #aeb6c5;
      --accent: #8eb0ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      line-height: 1.65;
    }
    main {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 80px;
    }
    header { margin-bottom: 32px; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3.5rem); }
    .lead { margin: 0; color: var(--sub); }
    .count { margin-top: 12px; color: var(--sub); font-size: .95rem; }
    .grid { display: grid; gap: 14px; }
    .card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      transition: transform .12s ease, border-color .12s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: #46516a; }
    .card a {
      display: block;
      padding: 20px;
      color: inherit;
      text-decoration: none;
    }
    .card h2 { margin: 0 0 8px; font-size: 1.15rem; }
    .card p { margin: 0 0 12px; color: var(--sub); }
    code { color: var(--accent); }
    .empty { color: var(--sub); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>HTML Share</h1>
      <p class="lead">共有ページ一覧</p>
      <p class="count">2 pages</p>
    </header>
    <section class="grid">

      <article class="card">
        <a href="/test">
          <h2>HTML Share Test</h2>
          <p>GitHub から Cloudflare Workers Static Assets へのデプロイ確認ページです。</p>
          <code>/test</code>
        </a>
      </article>

      <article class="card">
        <a href="/zam">
          <h2>次世代メモリ「ZAM」ざっくり解説</h2>
          <p>日本発の次世代メモリ ZAM と、SAIMEMORY・新光電気工業の協業をわかりやすく解説します。</p>
          <code>/zam</code>
        </a>
      </article>
    </section>
  </main>
</body>
</html>
